name: ci

on:
  pull_request:
  push:
    branches: [main]

# Read-only token: CI publishes nothing, comments on nothing.
permissions:
  contents: read

# One run per ref: a new push cancels the previous one.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-unit:
    name: lint + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: bot/go.mod
          cache-dependency-path: bot/go.sum

      # gofmt outputs nothing when everything is formatted and returns no
      # error otherwise: it is the presence of output that must fail the job.
      - name: gofmt
        working-directory: bot
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Unformatted files (run gofmt -w):" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: go vet
        working-directory: bot
        run: go vet ./...

      # The suites gated by env (integration, outbox) skip themselves here for
      # lack of DSNs: they run in the integration job.
      # Coverage gate: the unit run must keep the total statement coverage
      # above the floor. DB-bound packages (business, messages, storage,
      # users) score low here by design; they are covered by the integration
      # job instead, so the floor only guards the total against regressions
      # that delete tests.
      - name: go test with coverage
        working-directory: bot
        run: |
          go test -coverprofile=coverage.out -covermode=atomic ./...
          go tool cover -func=coverage.out | tee coverage.txt
          total=$(awk '/^total:/ {gsub(/%/, "", $3); print $3}' coverage.txt)
          echo "total coverage: ${total}% (floor 60%)"
          echo "### Coverage: ${total}% (floor 60%)" >> "$GITHUB_STEP_SUMMARY"
          awk '/^total:/ {gsub(/%/, "", $3); if ($3 + 0 < 60) {print "coverage " $3 "% below floor 60%"; exit 1}}' coverage.txt

  integration:
    name: PostgreSQL 16 integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: bot/go.mod
          cache-dependency-path: bot/go.sum

      # The script starts its own disposable postgres:16-alpine container
      # (random published port on 127.0.0.1, no volume, removed in a trap on
      # EXIT) and exports the admin/runtime/outbox DSNs. No container service
      # is declared here: that would be a useless second Postgres, without the
      # restricted role created by db/init/01-app-role.sh.
      - name: make test-integration
        run: make test-integration

  coverage:
    name: combined coverage (unit + integration)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: bot/go.mod
          cache-dependency-path: bot/go.sum

      # Unit + integration statement coverage with a 75% floor gate
      # (measured ~78%): the unit gate cannot see the DB-bound packages,
      # this one can. Disposable container like the integration job.
      - name: make test-coverage
        run: make test-coverage

  fuzz:
    name: short fuzz runs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: bot/go.mod
          cache-dependency-path: bot/go.sum

      # Bounded engine runs beyond the seed corpus. The seeds (f.Add in the
      # Fuzz* tests plus testdata/fuzz regression inputs) already run as
      # ordinary unit tests in lint-unit; these short runs let the mutator
      # explore further. One -fuzz invocation per target: Go refuses a
      # regexp matching more than one fuzz test. Any property violation
      # fails the job with a minimised reproducer under testdata/fuzz.
      - name: fuzz telegram (parse, splits, decode)
        working-directory: bot
        run: |
          go test -run=NONE -fuzz=FuzzParseCommand -fuzztime=30s ./internal/telegram/
          go test -run=NONE -fuzz=FuzzSplitTelegramText -fuzztime=60s ./internal/telegram/
          go test -run=NONE -fuzz=FuzzSplitPolicyText -fuzztime=60s ./internal/telegram/
          go test -run=NONE -fuzz=FuzzMessageUnmarshalJSON -fuzztime=30s ./internal/telegram/

      - name: fuzz media guards
        working-directory: bot
        run: |
          go test -run=NONE -fuzz=FuzzValidateFilePath -fuzztime=30s ./internal/media/store/
          go test -run=NONE -fuzz=FuzzValidateRelativePath -fuzztime=30s ./internal/media/
          go test -run=NONE -fuzz=FuzzValidateSHA256 -fuzztime=30s ./internal/media/
