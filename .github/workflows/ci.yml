name: ci

on:
  pull_request:
  push:
    branches: [main]

# Jeton en lecture seule : la CI ne publie rien, ne commente rien.
permissions:
  contents: read

# Une seule exécution par ref : un nouveau push annule la précédente.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-unit:
    name: lint + tests unitaires
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: bot/go.mod
          cache-dependency-path: bot/go.sum

      # gofmt ne sort rien quand tout est formaté et ne renvoie pas d’erreur
      # sinon : c’est la présence de sortie qui doit faire échouer le job.
      - name: gofmt
        working-directory: bot
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Fichiers non formatés (lancer gofmt -w) :" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: go vet
        working-directory: bot
        run: go vet ./...

      # Les suites gates par env (integration, outbox) se skippent ici faute de
      # DSN : elles tournent dans le job integration.
      - name: go test
        working-directory: bot
        run: go test ./...

  integration:
    name: intégration PostgreSQL 16
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: bot/go.mod
          cache-dependency-path: bot/go.sum

      # Le script démarre lui-même son conteneur postgres:16-alpine jetable
      # (port publié aléatoire sur 127.0.0.1, aucun volume, suppression en
      # trap EXIT) et exporte les DSN admin/runtime/outbox. Aucun service
      # container n’est déclaré ici : ce serait un second Postgres inutile,
      # sans le rôle restreint créé par db/init/01-app-role.sh.
      - name: make test-integration
        run: make test-integration
