name: ci

on:
  pull_request:
  push:
    branches: [main]
  # Weekly drift check: dependency-only breakage (postgres image, actions,
  # Go toolchain) must not wait for the next PR to surface. The restore
  # recipes run here too -- they are too slow for every PR.
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

# Read-only token: CI publishes nothing, comments on nothing.
permissions:
  contents: read

# One run per ref: a new push cancels the previous one.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-unit:
    name: lint + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: bot/go.mod
          cache-dependency-path: bot/go.sum

      # gofmt outputs nothing when everything is formatted and returns no
      # error otherwise: it is the presence of output that must fail the job.
      - name: gofmt
        working-directory: bot
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Unformatted files (run gofmt -w):" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: go vet
        working-directory: bot
        run: go vet ./...

      # go.mod/go.sum must be committed tidy: a dirty diff means the module
      # files were changed without committing the result.
      - name: go mod tidy check
        working-directory: bot
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      # The suites gated by env (integration, outbox) skip themselves here for
      # lack of DSNs: they run in the integration job.
      # Coverage gate: the unit run must keep the total statement coverage
      # above the floor. DB-bound packages (business is unit-tested via
      # fakes, messages/storage/users/media-repository stay DB-bound by
      # design) score low here; they are covered by the integration job
      # instead, so the floor only guards the total against regressions
      # that delete tests.
      - name: go test with coverage
        working-directory: bot
        run: |
          go test -coverprofile=coverage.out -covermode=atomic ./...
          go tool cover -func=coverage.out | tee coverage.txt
          total=$(awk '/^total:/ {gsub(/%/, "", $3); print $3}' coverage.txt)
          echo "total coverage: ${total}% (floor 70%)"
          echo "### Coverage: ${total}% (floor 70%)" >> "$GITHUB_STEP_SUMMARY"
          awk '/^total:/ {gsub(/%/, "", $3); if ($3 + 0 < 70) {print "coverage " $3 "% below floor 70%"; exit 1}}' coverage.txt

  integration:
    name: PostgreSQL 16 integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: bot/go.mod
          cache-dependency-path: bot/go.sum

      # The script starts its own disposable postgres:16-alpine container
      # (random published port on 127.0.0.1, no volume, removed in a trap on
      # EXIT) and exports the admin/runtime/outbox DSNs. No container service
      # is declared here: that would be a useless second Postgres, without the
      # restricted role created by db/init/01-app-role.sh.
      - name: make test-integration
        run: make test-integration

  coverage:
    name: combined coverage (unit + integration)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: bot/go.mod
          cache-dependency-path: bot/go.sum

      # Unit + integration statement coverage with a 75% floor gate
      # (measured ~78%): the unit gate cannot see the DB-bound packages,
      # this one can. Disposable container like the integration job.
      - name: make test-coverage
        run: make test-coverage

  docker-build:
    name: docker build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # The production image is otherwise never built before deploy: a
      # broken Dockerfile (or a base image that no longer resolves) must
      # fail here, not on the deployment machine.
      - name: docker build bot
        run: docker build ./bot

  restore:
    name: backup restore recipes
    # Too slow for every PR (two disposable databases plus two media
    # restores); the weekly schedule and manual runs cover them. The scripts
    # refuse foreign DSNs and never touch existing volumes, so they are safe
    # to run unattended.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: make test-restore
        run: make test-restore

      - name: make test-restore-media
        run: make test-restore-media
