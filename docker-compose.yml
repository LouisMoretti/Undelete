name: undelete

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      APP_DB_USER: undelete_app
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    # No "ports": Postgres is only reachable from the internal Docker
    # network (bot, backup). No exposure on the host, even locally --
    # reduces the attack surface and avoids leaks of message content in
    # case of a misconfigured firewall.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  bot:
    build:
      context: ./bot
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      OWNER_TELEGRAM_USER_ID: ${OWNER_TELEGRAM_USER_ID}
      # The same variable the backup service below purges its archives with,
      # and it must stay the same value: the bot never touches a backup, it
      # only quotes this number to the owner as the maximum residual survival
      # of the data an on-demand /delete_my_data just deleted. Two different
      # values here and there would make that statement false.
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS}
      # Probes /livez, /readyz and /metrics. No "ports" here either: the port
      # stays internal to the Docker network, like Postgres.
      # Form ${VAR-default} and not ${VAR:-default}: a HEALTH_ADDR set to an
      # empty value in .env must keep its meaning ("health server disabled"),
      # not fall back to the default. The healthcheck below assumes port
      # 9090: changing it here requires changing it there too.
      HEALTH_ADDR: ${HEALTH_ADDR-:9090}
    volumes:
      - ./media:/app/media
    # Hardened container: fixed non-root user, read-only filesystem (only
    # /tmp as tmpfs and the ./media bind mount are writable), all Linux
    # capabilities dropped, no privilege escalation possible.
    user: "10001:10001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    # /livez and not /readyz: liveness depends only on the process. A
    # readyz on Docker would restart a healthy bot in a loop as soon as
    # Postgres or Telegram hiccups, which fixes nothing.
    # wget comes from busybox (alpine image), no extra package.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:9090/livez || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS}
      MEDIA_BACKUP_MODE: ${MEDIA_BACKUP_MODE-auto}
      MEDIA_BACKUP_FULL_INTERVAL_DAYS: ${MEDIA_BACKUP_FULL_INTERVAL_DAYS-7}
      # Optional dead man's switch (e.g. healthchecks.io): pinged after every
      # fully successful pass (dump AND media). A missed ping means the backups
      # are NOT happening -- the one failure this system must never sleep
      # through. Empty by default (no ping). See docs/runbook.md.
      BACKUP_PING_URL: ${BACKUP_PING_URL-}
    volumes:
      - ./scripts:/scripts:ro
      # Media are read here, never written: this service backs the directory
      # up, and nothing in scripts/backup-media.sh deletes or modifies a media
      # file. `:ro` makes that structural rather than a promise.
      - ./media:/media:ro
      - ./backups:/backups
    working_dir: /backups
    entrypoint:
      - sh
      - -c
      - |
        # Daily backup: an immediate pg_dump, then a loop that waits 24h
        # between each pass. No cron to keep things simple and avoid an
        # extra dependency in the image.
        # Failure discipline: every failure prints a "backup: FATAL" line (grep
        # for it in `docker compose logs backup`), the loop goes on (tomorrow's
        # dump must still be taken), and a fully successful pass prints
        # "backup: OK" and pings BACKUP_PING_URL when set.
        export BACKUP_DIR=/backups
        export MEDIA_DIR=/media
        while true; do
          failed=0
          sh /scripts/backup.sh || { echo "backup: FATAL database dump failed (exit $?) -- investigate before the next window" >&2; failed=1; }
          # Media AFTER the dump, never before: backup-media.sh couples its
          # archive to the most recent dump present, so running it first would
          # tie today's media to yesterday's database. A media failure must
          # not abort the loop -- the dump of the next window still has to be
          # taken -- so it is reported and the loop goes on.
          sh /scripts/backup-media.sh || { echo "backup: FATAL media backup failed (exit $?)" >&2; failed=1; }
          if [ "$failed" -eq 0 ]; then
            echo "backup: OK daily pass complete"
            if [ -n "${BACKUP_PING_URL:-}" ]; then
              wget -q -O /dev/null -T 10 "$BACKUP_PING_URL" || echo "backup: FATAL dead man's switch ping failed" >&2
            fi
          fi
          sleep 86400
        done

volumes:
  postgres_data:
